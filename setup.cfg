[metadata]
name = lbsm
version = 0.1.0
description = Latent Behavioral State Machines research framework
long_description = file: README.md
long_description_content_type = text/markdown
author = PardhuVarma
license = MIT
license_files = LICENSE
url = https://github.com/PardhuSreeRushiVarma20060119/lbsm-research

[options]
packages = find:
python_requires = >=3.12

[options.packages.find]
where = .
include = src*

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude = .venv,.git,__pycache__,build,dist,notebooks
