[project]
name = "lbsm"
version = "0.1.0"
description = "Latent Behavioral State Machines research framework"
readme = "README.md"
requires-python = ">=3.12"

authors = [
  { name = "PardhuVarma" }
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]